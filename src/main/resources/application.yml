# ==========================================
# 基础配置
# ==========================================
server:
  port: 8080

spring:
  application:
    name: smart-campus-portal

  # ==========================================
  # 数据库连接配置
  # ==========================================
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 指向 smart_campus1 数据库，并配置时区和字符集
    url: jdbc:mysql://localhost:3306/smart_campus1?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&nullCatalogMeansCurrent=true
    username: root
    password: root

  elasticsearch:
    uris: http://localhost:9200 # ES 服务地址

  data:
    redis:
      host: localhost
      port: 6379
      password: 
      database: 0
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0

# ==========================================
# MyBatis-Plus 配置
# ==========================================
mybatis-plus:
  configuration:
    # 开启驼峰命名自动映射
    map-underscore-to-camel-case: true
    # 打印 SQL 日志
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  
  global-config:
    db-config:
      # 逻辑删除全局属性
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0